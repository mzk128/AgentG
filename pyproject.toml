[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Multi-agent collaboration system built with LangGraph"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.2.16",
  "langgraph>=0.2.30",
  "langchain-openai>=0.1.22",
  "python-dotenv>=1.0.1",
  "redis>=5.0.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "ddgs>=9.0",
  "requests>=2.28",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
