<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>AgentG · Multi-Agent Workspace</title>
<style>
:root,
:root[data-theme="graphite"] {
  --bg:#0c0d10; --sidebar:#111318; --panel:#16191f; --panel-2:#1b1f27;
  --panel-3:#222733; --border:#292e38; --border-strong:#3a414f;
  --text:#f2f4f7; --muted:#9299a8; --muted-2:#687080;
  --text-soft:#d9dde6; --input-text:#cdd2dc;
  --accent:#7c8cff; --accent-soft:rgba(124,140,255,.14);
  --cyan:#54c7ec; --purple:#b18cff; --green:#55d98b; --red:#ff6b79;
  --yellow:#f2bf5e; --shadow:0 18px 50px rgba(0,0,0,.24);
  --header-bg:rgba(12,13,16,.9); --workflow-bg:rgba(22,25,31,.72);
  --composer-fade:rgba(12,13,16,0); --brand-a:#7185ff; --brand-b:#9c72ed; --brand-mark-fg:#fff;
  --radius:12px;
  color-scheme:dark;
}
:root[data-theme="midnight"] {
  --bg:#07111d; --sidebar:#0a1624; --panel:#0f1d2d; --panel-2:#13243a;
  --panel-3:#1a304a; --border:#203852; --border-strong:#315273;
  --text:#edf7ff; --muted:#8fa8bd; --muted-2:#607b92;
  --text-soft:#d7e8f5; --input-text:#c6dce9;
  --accent:#35b8ff; --accent-soft:rgba(53,184,255,.14);
  --cyan:#49d6d0; --purple:#8ca7ff; --green:#55d99a; --red:#ff7082;
  --yellow:#efc761; --shadow:0 18px 54px rgba(0,5,12,.34);
  --header-bg:rgba(7,17,29,.92); --workflow-bg:rgba(15,29,45,.8);
  --composer-fade:rgba(7,17,29,0); --brand-a:#24a6ef; --brand-b:#586cf4;
  color-scheme:dark;
}
:root[data-theme="paper"] {
  --bg:#f6f5f1; --sidebar:#ecebe6; --panel:#ffffff; --panel-2:#f2f1ed;
  --panel-3:#e7e5df; --border:#d8d5cc; --border-strong:#bdb9ae;
  --text:#202124; --muted:#6f716f; --muted-2:#95958f;
  --text-soft:#343638; --input-text:#474947;
  --accent:#5368dc; --accent-soft:rgba(83,104,220,.1);
  --cyan:#147d9a; --purple:#7357b6; --green:#258758; --red:#c83f52;
  --yellow:#a56a00; --shadow:0 18px 48px rgba(54,51,44,.12);
  --header-bg:rgba(246,245,241,.92); --workflow-bg:rgba(255,255,255,.76);
  --composer-fade:rgba(246,245,241,0); --brand-a:#5c72e8; --brand-b:#8663d3;
  color-scheme:light;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  overflow:hidden; background:var(--bg); color:var(--text);
  font-family:Inter,"SF Pro Text","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .18s ease,color .18s ease;
}
button,textarea,input { font:inherit; }
button { color:inherit; }
.app { display:grid; grid-template-columns:292px minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:100vh; height:100dvh; }

.sidebar {
  min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; background:var(--sidebar);
  border-right:1px solid var(--border);
}
.brand { display:flex; align-items:center; gap:11px; padding:18px 16px 14px; }
.brand-mark {
  width:31px; height:31px; display:grid; place-items:center; border-radius:9px;
  background:linear-gradient(145deg,var(--brand-a),var(--brand-b)); box-shadow:0 8px 24px rgba(124,140,255,.22);
  color:var(--brand-mark-fg); flex:0 0 auto;
}
.brand-mark svg { width:27px; height:27px; display:block; }
.brand-copy strong { display:block; font-size:15px; letter-spacing:.2px; }
.brand-copy span { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
.new-task {
  margin:4px 12px 12px; padding:9px 11px; display:flex; align-items:center; gap:9px;
  border:1px solid var(--border); border-radius:9px; background:transparent;
  color:var(--text-soft); cursor:pointer; transition:.16s ease;
}
.new-task:hover { background:var(--panel); border-color:var(--border-strong); }
.new-task kbd { margin-left:auto; color:var(--muted-2); font-size:10px; }
.sidebar-section-title {
  display:flex; align-items:center; justify-content:space-between; padding:8px 16px;
  color:var(--muted); font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase;
}
.brand,.new-task,.sidebar-section-title,.sidebar-footer { flex-shrink:0; }
.history {
  min-height:0; flex:1 1 0; overflow-y:auto; overflow-x:hidden; padding:0 8px 12px;
  overscroll-behavior:contain; scrollbar-gutter:stable;
  scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;
}
.history:focus-visible { outline:1px solid var(--accent); outline-offset:-1px; }
.history::-webkit-scrollbar { width:9px; height:9px; }
.history::-webkit-scrollbar-track { background:transparent; }
.history::-webkit-scrollbar-thumb { border:2px solid transparent; border-radius:999px; background:var(--border-strong); background-clip:padding-box; }
.history::-webkit-scrollbar-thumb:hover { background:var(--muted-2); background-clip:padding-box; }
.history-empty { padding:18px 10px; color:var(--muted-2); font-size:12px; line-height:1.55; }
.history-item {
  width:100%; padding:10px; margin-bottom:3px; border:1px solid transparent; border-radius:9px;
  background:transparent; text-align:left; cursor:pointer; transition:.15s ease;
}
.history-item:hover { background:var(--panel); }
.history-item.active { background:var(--panel-2); border-color:var(--border); }
.history-title { display:flex; align-items:center; gap:6px; overflow:hidden; color:var(--text-soft); font-size:12.5px; line-height:1.4; }
.history-title-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-pin { flex:0 0 auto; color:var(--accent); font-size:10px; }
.history-meta { display:flex; align-items:center; gap:7px; margin-top:7px; color:var(--muted-2); font-size:10.5px; }
.history-time { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.status-badge {
  flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; padding:2px 7px;
  border:1px solid transparent; border-radius:999px; font-size:9.5px; font-weight:750;
  letter-spacing:.035em; text-transform:uppercase;
}
.status-badge::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.status-badge.run { color:var(--cyan); background:rgba(84,199,236,.1); border-color:rgba(84,199,236,.18); }
.status-badge.run::before { animation:pulse 1.4s ease-in-out infinite; }
.status-badge.success { color:var(--green); background:rgba(85,217,139,.1); border-color:rgba(85,217,139,.18); }
.status-badge.failure { color:var(--red); background:rgba(255,107,121,.1); border-color:rgba(255,107,121,.18); }
.status-badge.pending { color:var(--yellow); background:rgba(242,191,94,.1); border-color:rgba(242,191,94,.18); }
.sidebar-footer { position:relative; padding:9px 10px 11px; border-top:1px solid var(--border); }
.sidebar-tools { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.sidebar-action-group { display:flex; align-items:center; gap:3px; }
.theme-toggle,.hotkey-toggle {
  display:flex; align-items:center; gap:8px; min-width:0; padding:7px 8px;
  border:1px solid transparent; border-radius:8px; background:transparent; color:var(--muted);
  font-size:11px; cursor:pointer;
}
.theme-toggle:hover,.theme-toggle[aria-expanded="true"],.hotkey-toggle:hover,.hotkey-toggle[aria-expanded="true"] { color:var(--text); background:var(--panel-2); border-color:var(--border); }
.theme-swatch { width:12px; height:12px; border-radius:50%; background:linear-gradient(135deg,var(--brand-a),var(--brand-b)); box-shadow:0 0 0 2px var(--border); }
.theme-menu,.hotkey-menu {
  display:none; position:absolute; z-index:50; left:10px; bottom:45px; width:188px; padding:6px;
  border:1px solid var(--border); border-radius:10px; background:var(--panel); box-shadow:var(--shadow);
}
.hotkey-menu { left:78px; width:176px; }
.theme-menu.visible,.hotkey-menu.visible { display:block; }
.theme-option,.hotkey-option { width:100%; display:flex; align-items:center; gap:9px; padding:8px; border:0; border-radius:7px; background:transparent; text-align:left; font-size:11.5px; cursor:pointer; }
.theme-option:hover,.theme-option.active,.hotkey-option:hover,.hotkey-option.active { background:var(--accent-soft); color:var(--text); }
.theme-option small,.hotkey-option small { margin-left:auto; color:var(--muted-2); }
.connection { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; }
.connection-dot { width:7px; height:7px; border-radius:50%; background:var(--muted-2); }
.connection-dot.ok { background:var(--green); box-shadow:0 0 0 3px rgba(85,217,139,.1); }
.connection-dot.error { background:var(--red); box-shadow:0 0 0 3px rgba(255,107,121,.1); }

.workspace { min-width:0; min-height:0; height:100%; overflow:hidden; display:flex; flex-direction:column; background:var(--bg); }
.workspace-header {
  min-height:61px; display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:10px 24px; border-bottom:1px solid var(--border); background:var(--header-bg);
}
.title-group { min-width:0; display:flex; align-items:center; gap:11px; }
.title-copy { min-width:0; }
.title-copy h1 { overflow:hidden; font-size:13.5px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
.title-copy p { margin-top:3px; color:var(--muted); font-size:10.5px; }
.header-status { flex:0 0 auto; }
.workflow-bar {
  display:none; align-items:center; gap:9px; min-height:36px; padding:7px 24px;
  border-bottom:1px solid var(--border); background:var(--workflow-bg); color:var(--muted); font-size:11.5px;
}
.workflow-bar.visible { display:flex; }
.workflow-bar.running {
  position:relative; color:var(--text-soft); background:linear-gradient(90deg,var(--workflow-bg),var(--accent-soft),var(--workflow-bg));
  background-size:220% 100%; animation:runningSweep 2.8s linear infinite;
}
.workflow-bar.running::after { content:""; position:absolute; right:0; bottom:-1px; left:0; height:2px; background:linear-gradient(90deg,transparent,var(--cyan),transparent); }
.workflow-dot { width:6px; height:6px; border-radius:50%; background:var(--muted-2); }
.workflow-dot.thinking,.workflow-dot.retrying,.workflow-dot.resuming { background:var(--cyan); animation:pulse 1.2s ease-in-out infinite; }
.workflow-dot.complete { background:var(--green); }
.running-label { font-weight:700; color:var(--text); }
.running-elapsed { margin-left:auto; color:var(--cyan); font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace; font-size:10.5px; font-variant-numeric:tabular-nums; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.28} }
@keyframes runningSweep { from{background-position:100% 0} to{background-position:-120% 0} }

.workspace-content {
  position:relative; min-height:0; height:0; flex:1 1 auto;
}
.output {
  width:100%; height:100%; min-width:0; min-height:0; overflow-x:hidden; overflow-y:auto;
  overscroll-behavior:contain; padding:28px 70px 36px 24px; scroll-behavior:smooth;
  scrollbar-gutter:stable;
  scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent;
}
.output::-webkit-scrollbar { width:9px; }
.output::-webkit-scrollbar-track { background:transparent; }
.output::-webkit-scrollbar-thumb { border:2px solid transparent; border-radius:999px; background:var(--border-strong); background-clip:padding-box; }
.output::-webkit-scrollbar-thumb:hover { background:var(--muted-2); background-clip:padding-box; }
.output-inner { width:min(100%,980px); min-height:100%; margin:0 auto; }
.empty-state { min-height:100%; display:grid; place-items:center; }
.empty-content { max-width:470px; text-align:center; }
.empty-icon {
  width:52px; height:52px; display:grid; place-items:center; margin:0 auto 16px;
  border:1px solid var(--border); border-radius:15px; background:linear-gradient(145deg,var(--panel-2),var(--panel));
  box-shadow:var(--shadow); color:var(--accent);
}
.empty-icon svg { width:42px; height:42px; display:block; }
.svg-defs { position:absolute; width:0; height:0; overflow:hidden; pointer-events:none; }
.empty-content h2 { font-size:17px; font-weight:650; }
.empty-content p { margin-top:8px; color:var(--muted); font-size:12.5px; line-height:1.65; }
.timeline { position:relative; padding-left:25px; }
.timeline::before { content:""; position:absolute; left:7px; top:14px; bottom:18px; width:1px; background:var(--border); }
.card { position:relative; margin-bottom:15px; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel); box-shadow:0 10px 34px rgba(0,0,0,.12); }
.card::before {
  content:""; position:absolute; left:-22px; top:17px; width:7px; height:7px; border:2px solid var(--bg);
  border-radius:50%; background:var(--muted-2); box-shadow:0 0 0 1px var(--border);
}
.card.task_router::before,.card.orchestrator::before { background:var(--purple); }
.card.research_worker::before,.card.code_worker::before,.card.data_worker::before,.card.synthesis_worker::before { background:var(--cyan); }
.card.reviewer::before,.card.done::before { background:var(--green); }
.card.user_summary::before { background:var(--green); box-shadow:0 0 0 1px var(--green),0 0 14px rgba(85,217,139,.2); }
.card.decision_trace::before { background:var(--cyan); box-shadow:0 0 0 1px var(--cyan),0 0 12px rgba(67,197,255,.18); }
.card.user::before { background:var(--accent); }
.card.error::before,.card.resource_terminated::before { background:var(--red); }
.card-header { display:flex; align-items:center; justify-content:space-between; padding:10px 13px; border-bottom:1px solid var(--border); }
.agent-label { display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:750; letter-spacing:.045em; text-transform:uppercase; }
.agent-label.task_router,.agent-label.orchestrator { color:var(--purple); }
.agent-label.research_worker,.agent-label.code_worker,.agent-label.data_worker,.agent-label.synthesis_worker { color:var(--cyan); }
.agent-label.reviewer,.agent-label.done { color:var(--green); }
.agent-label.user_summary { color:var(--green); }
.agent-label.decision_trace { color:var(--cyan); }
.agent-label.user { color:var(--accent); }
.agent-label.error,.agent-label.resource_terminated { color:var(--red); }
.card-controls { flex:0 0 auto; display:flex; align-items:center; gap:7px; }
.card-step { color:var(--muted-2); font-size:10px; }
.card-toggle {
  width:25px; height:23px; display:grid; place-items:center; border:1px solid transparent;
  border-radius:6px; background:transparent; color:var(--muted); font-size:12px; cursor:pointer;
  transition:background .15s ease,color .15s ease,transform .15s ease;
}
.card-toggle:hover { border-color:var(--border); background:var(--panel-2); color:var(--text); }
.card.collapsed .card-header { border-bottom-color:transparent; }
.card.collapsed .card-body { display:none; }
.card.collapsed .card-toggle { transform:rotate(-90deg); }
.card-body {
  overflow:visible; padding:13px 14px 15px; color:var(--text-soft);
  font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace; font-size:12px;
  line-height:1.62; white-space:pre-wrap; word-break:break-word;
}
.card.user_summary { border-color:rgba(85,217,139,.28); background:linear-gradient(145deg,var(--panel),rgba(85,217,139,.035)); }
.card.user_summary .card-body { font-family:Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif; font-size:13px; line-height:1.72; }
.card.decision_trace { border-color:rgba(67,197,255,.22); background:linear-gradient(145deg,var(--panel),rgba(67,197,255,.025)); }
.card.decision_trace .card-body { font-family:Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif; font-size:12px; line-height:1.65; }
.card-content { white-space:pre-wrap; word-break:break-word; }
.markdown-body { white-space:normal; overflow-wrap:anywhere; }
.markdown-body > :first-child { margin-top:0; }
.markdown-body > :last-child { margin-bottom:0; }
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6 {
  margin:1.05em 0 .48em; color:var(--text); line-height:1.32; font-family:Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif;
}
.markdown-body h1 { font-size:1.38em; }
.markdown-body h2 { font-size:1.24em; }
.markdown-body h3 { font-size:1.12em; }
.markdown-body h4,.markdown-body h5,.markdown-body h6 { font-size:1em; }
.markdown-body p { margin:.65em 0; }
.markdown-body ul,.markdown-body ol { margin:.65em 0; padding-left:1.65em; }
.markdown-body li + li { margin-top:.28em; }
.markdown-body strong { color:var(--text); font-weight:700; }
.markdown-body a { color:var(--cyan); text-decoration:none; }
.markdown-body a:hover { text-decoration:underline; }
.markdown-body code {
  padding:.12em .36em; border:1px solid var(--border); border-radius:5px;
  background:var(--panel-2); color:var(--text); font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace; font-size:.92em;
}
.markdown-body pre {
  margin:.8em 0; padding:11px 12px; overflow:auto; border:1px solid var(--border);
  border-radius:8px; background:var(--panel-2); white-space:pre;
}
.markdown-body pre code { padding:0; border:0; background:transparent; }
.markdown-body blockquote { margin:.75em 0; padding:.2em 0 .2em 11px; border-left:3px solid var(--accent); color:var(--muted); }
.markdown-body hr { margin:1em 0; border:0; border-top:1px solid var(--border); }
.markdown-table-wrap { margin:.8em 0; overflow-x:auto; }
.markdown-body table { width:100%; border-collapse:collapse; background:color-mix(in srgb,var(--panel) 82%,transparent); }
.markdown-body th,.markdown-body td { padding:7px 9px; border:1px solid var(--border); text-align:left; vertical-align:top; }
.markdown-body th { background:var(--panel-2); color:var(--text); font-weight:700; }
.process-group {
  margin:0 0 15px; border:1px solid var(--border); border-radius:var(--radius);
  background:color-mix(in srgb,var(--panel) 84%,transparent); box-shadow:0 8px 28px rgba(0,0,0,.08);
}
.process-group > summary {
  min-height:42px; display:flex; align-items:center; gap:9px; padding:9px 13px;
  color:var(--text-soft); cursor:pointer; list-style:none; user-select:none;
}
.process-group > summary::-webkit-details-marker { display:none; }
.process-chevron { color:var(--muted); font-size:12px; transition:transform .15s ease; }
.process-group:not([open]) .process-chevron { transform:rotate(-90deg); }
.process-title { font-size:11px; font-weight:700; letter-spacing:.035em; }
.process-count { margin-left:auto; color:var(--muted-2); font-size:10px; }
.process-body { padding:2px 12px 1px; border-top:1px solid var(--border); }
.process-body > .card:first-child { margin-top:12px; }
.decision-trace-group { margin-top:13px; padding-top:10px; border-top:1px dashed var(--border); }
.decision-trace-group > summary {
  display:flex; align-items:center; gap:7px; color:var(--cyan); cursor:pointer;
  font-family:Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif; font-size:11px; font-weight:650;
  list-style:none; user-select:none;
}
.decision-trace-group > summary::-webkit-details-marker { display:none; }
.trace-chevron { color:var(--muted); transition:transform .15s ease; }
.decision-trace-group:not([open]) .trace-chevron { transform:rotate(-90deg); }
.decision-trace-count { color:var(--muted-2); font-size:10px; font-weight:500; }
.decision-trace-list { display:flex; flex-direction:column; gap:7px; margin-top:9px; }
.decision-trace-entry {
  padding:8px 10px; border-left:2px solid var(--cyan); border-radius:0 7px 7px 0;
  background:var(--panel-2); color:var(--text-soft); font-family:Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:11.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
}
.turn-section { scroll-margin-top:18px; }
.turn-divider { margin:4px 0 12px; color:var(--muted-2); font-size:10px; letter-spacing:.04em; text-transform:uppercase; }
.progress-placeholder { padding:22px; text-align:center; color:var(--muted); }
.progress-placeholder.running { margin:12px 0; border:1px solid color-mix(in srgb,var(--cyan) 34%,var(--border)); border-radius:12px; background:linear-gradient(110deg,transparent,var(--accent-soft),transparent); background-size:220% 100%; animation:runningSweep 2.8s linear infinite; }
.progress-placeholder strong { display:block; color:var(--text-soft); font-size:13px; }
.progress-placeholder span { display:block; margin-top:6px; font-size:11.5px; }

.turn-nav {
  position:absolute; z-index:35; top:50%; right:15px; width:29px; height:min(64%,440px);
  overflow:visible; outline:0; transform:translateY(-50%);
}
.turn-nav-rail {
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
  align-items:flex-end; gap:clamp(8px,1.8vh,18px); overflow:hidden;
}
.turn-nav-rail-item {
  flex:0 0 10px; width:28px; display:flex; align-items:center; justify-content:flex-end;
  border:0; background:transparent; cursor:pointer;
}
.turn-nav-rail-marker,.turn-nav-marker {
  width:8px; height:2px; border-radius:999px; background:var(--muted-2);
  transition:width .15s ease,background .15s ease,box-shadow .15s ease;
}
.turn-nav-rail-item:hover .turn-nav-rail-marker,
.turn-nav-rail-item.active .turn-nav-rail-marker { width:13px; background:var(--accent); box-shadow:0 0 8px var(--accent-soft); }
.turn-nav-panel {
  visibility:hidden; position:absolute; z-index:2; top:50%; right:0; width:244px;
  max-height:min(68vh,520px); padding:10px 7px; overflow:hidden;

  const name = themes[themeName] ? themeName : 'graphite';
  document.documentElement.dataset.theme = name;
  document.querySelector('meta[name="color-scheme"]').content = themes[name].colorScheme;
  document.getElementById('themeLabel').textContent = themes[name].label;
  document.querySelectorAll('.theme-option[data-theme]').forEach(option => option.classList.toggle('active', option.dataset.theme === name));
  if (persist) {
    try { window.localStorage.setItem('agentg-theme', name); } catch (_) {}
  }
}

function initialiseTheme() {
  let saved = 'graphite';
  try { saved = window.localStorage.getItem('agentg-theme') || saved; } catch (_) {}
  applyTheme(saved, false);
}

function closeThemeMenu() {
  document.getElementById('themeMenu').classList.remove('visible');
  document.getElementById('themeToggle').setAttribute('aria-expanded', 'false');
}

function closeHotkeyMenu() {
  document.getElementById('hotkeyMenu').classList.remove('visible');
  document.getElementById('hotkeyToggle').setAttribute('aria-expanded', 'false');
}

function applySubmitHotkey(name, persist=true) {
  submitHotkey = submitHotkeys[name] ? name : 'ctrl-enter';
  document.querySelectorAll('.hotkey-option[data-hotkey]').forEach(option =>
    option.classList.toggle('active', option.dataset.hotkey === submitHotkey)
  );
  document.getElementById('submitBtn').title = `${submitHotkeys[submitHotkey].label} 执行任务`;
  if (persist) {
    try { window.localStorage.setItem('agentg-submit-hotkey', submitHotkey); } catch (_) {}
  }
  updateComposerMode(currentTask);
}

function initialiseSubmitHotkey() {
  let saved = 'ctrl-enter';
  try { saved = window.localStorage.getItem('agentg-submit-hotkey') || saved; } catch (_) {}
  applySubmitHotkey(saved, false);
}

function matchesSubmitHotkey(event) {
  if (event.key !== 'Enter') return false;
  const binding = submitHotkeys[submitHotkey];
  return Boolean(event.ctrlKey || event.metaKey) === Boolean(binding.ctrl) &&
    Boolean(event.altKey) === Boolean(binding.alt) &&
    Boolean(event.shiftKey) === Boolean(binding.shift);
}

function formatElapsed(totalSeconds) {
  const seconds = Math.max(0, Math.floor(totalSeconds || 0));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  return hours ? `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(rest).padStart(2,'0')}` :
    `${String(minutes).padStart(2,'0')}:${String(rest).padStart(2,'0')}`;
}

function updateRuntimeClock() {
  const elapsed = document.getElementById('runningElapsed');
  if (!currentTask || outcomeOf(currentTask) !== 'run') {
    elapsed.hidden = true;
    elapsed.textContent = '';
    return;
  }
  const policyStarted = Number((currentTask.resource_policy || {}).started_at || 0);
  const started = Number(currentTask.run_started_at || policyStarted || currentTask.created_at || Date.now() / 1000);
  elapsed.textContent = `运行 ${formatElapsed(Date.now() / 1000 - started)}`;
  elapsed.hidden = false;
}

function showToast(message, isError=false) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast visible${isError ? ' error' : ''}`;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2600);
}

function escapeHtml(value) {
  const element = document.createElement('div');
  element.textContent = value == null ? '' : String(value);
  return element.innerHTML;
}

function safeMarkdownUrl(value) {
  try {
    const parsed = new URL(String(value || ''), window.location.origin);
    return ['http:', 'https:', 'mailto:'].includes(parsed.protocol) ? parsed.href : '';
  } catch (_) { return ''; }
}

function renderMarkdownInline(value) {
  const tokens = [];
  const token = html => {
    const marker = `@@AGENTG_MD_${tokens.length}@@`;
    tokens.push(html);
    return marker;
  };
  let text = String(value == null ? '' : value);
  text = text.replace(/`([^`\n]+)`/g, (_, code) => token(`<code>${escapeHtml(code)}</code>`));
  text = text.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (_, label, target) => {
    const url = safeMarkdownUrl(target);
    if (!url) return label;
    return token(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`);
  });
  let html = escapeHtml(text)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  tokens.forEach((item, index) => { html = html.replace(`@@AGENTG_MD_${index}@@`, item); });
  return html;
}

function markdownTableCells(line) {
  let value = String(line || '').trim();
  if (value.startsWith('|')) value = value.slice(1);
  if (value.endsWith('|')) value = value.slice(0, -1);
  return value.split('|').map(cell => cell.trim());
}

function isMarkdownTableSeparator(line) {
  const cells = markdownTableCells(line);
  return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
}

function renderMarkdown(value) {
  const lines = String(value == null ? '' : value).replace(/\r\n?/g, '\n').split('\n');
  const blocks = [];
  let paragraph = [];
  let listType = '';
  let listItems = [];
  let inFence = false;
  let fenceLanguage = '';
  let codeLines = [];

  const flushParagraph = () => {
    if (!paragraph.length) return;
    blocks.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
    paragraph = [];
  };
  const flushList = () => {
    if (!listItems.length) return;
    blocks.push(`<${listType}>${listItems.map(item => `<li>${renderMarkdownInline(item)}</li>`).join('')}</${listType}>`);
    listType = '';
    listItems = [];
  };
  const flushText = () => { flushParagraph(); flushList(); };

  for (let index = 0; index < lines.length; index += 1) {
    const line = lines[index];
    const fence = line.match(/^\s*```\s*([\w.+-]*)\s*$/);
    if (fence) {
      flushText();
      if (inFence) {
        const language = fenceLanguage ? ` data-language="${escapeHtml(fenceLanguage)}"` : '';
        blocks.push(`<pre><code${language}>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        inFence = false;
        fenceLanguage = '';
        codeLines = [];
      } else {
        inFence = true;
        fenceLanguage = fence[1] || '';
      }
      continue;
    }
    if (inFence) { codeLines.push(line); continue; }
    if (!line.trim()) { flushText(); continue; }

    if (index + 1 < lines.length && line.includes('|') && isMarkdownTableSeparator(lines[index + 1])) {
      flushText();
      const headers = markdownTableCells(line);
      index += 1;
      const rows = [];
      while (index + 1 < lines.length && lines[index + 1].trim() && lines[index + 1].includes('|')) {
        rows.push(markdownTableCells(lines[index + 1]));
        index += 1;
      }
      const head = headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('');
      const body = rows.map(row => `<tr>${headers.map((_, cellIndex) => `<td>${renderMarkdownInline(row[cellIndex] || '')}</td>`).join('')}</tr>`).join('');
      blocks.push(`<div class="markdown-table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
      continue;
    }

    const heading = line.match(/^(#{1,6})\s+(.+)$/);
    if (heading) {
      flushText();
      const level = heading[1].length;
      blocks.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`);
      continue;
    }
    if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) { flushText(); blocks.push('<hr>'); continue; }
    const unordered = line.match(/^\s*[-+*]\s+(.+)$/);
    const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
    if (unordered || ordered) {
      flushParagraph();
      const nextType = unordered ? 'ul' : 'ol';
      if (listType && listType !== nextType) flushList();
      listType = nextType;
      listItems.push((unordered || ordered)[1]);
      continue;
    }
    const quote = line.match(/^\s*>\s?(.*)$/);
    if (quote) { flushText(); blocks.push(`<blockquote>${renderMarkdownInline(quote[1])}</blockquote>`); continue; }
    if (listItems.length) flushList();
    paragraph.push(line);
  }
  if (inFence) blocks.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
  flushText();
  return blocks.join('');
}

const decisionStageLabels = {
  input:'接收任务', tool_selection:'选择工具', tool_observation:'观察结果',
  revision:'修订产物', delivery:'提交产物'
};

function formatDecisionTrace(trace={}) {
  const lines = [
    `${trace.task_id || 'unknown'} · ${decisionStageLabels[trace.stage] || trace.stage || '执行'} · ${trace.status || 'pending'}`,
    trace.summary || ''
  ];
  if (trace.action) lines.push(`动作：${trace.action}`);
  if (Array.isArray(trace.evidence_refs) && trace.evidence_refs.length) {
    lines.push(`证据引用：${trace.evidence_refs.join('、')}`);
  }
  return lines.filter(Boolean).join('\n');
}

function workerTraceKey(agentType, taskId, attempt=1) {
  return `${String(agentType || '').toLowerCase()}:${String(taskId || '')}:${Number(attempt || 1)}`;
}

function parseWorkerMessageIdentity(content='') {
  const match = String(content).match(/^\[(Research|Code|Data|Synthesis)Agent:([^\]]+)\]\s+attempt=(\d+)/i);
  if (!match) return null;
  return {agentType:match[1].toLowerCase(), taskId:match[2], attempt:Number(match[3])};
}

function registerAgentCard(card, identity) {
  if (!card || !identity) return;
  card.dataset.agentType = identity.agentType;
  card.dataset.taskId = identity.taskId;
  card.dataset.attempt = String(identity.attempt || 1);
  liveAgentCards.set(workerTraceKey(identity.agentType, identity.taskId, identity.attempt), card);
}

function findAgentCardForTrace(trace={}) {
  const exact = liveAgentCards.get(workerTraceKey(trace.agent_type, trace.task_id, trace.attempt));
  if (exact) return exact;
  return [...liveAgentCards.values()].find(card =>
    card.dataset.agentType === String(trace.agent_type || '').toLowerCase() &&
    card.dataset.taskId === String(trace.task_id || '')
  ) || null;
}

function attachDecisionTraceToCard(card, trace={}, collapsed=false) {
  if (!card) return false;
  const body = card.querySelector('.card-body');
  if (!body) return false;
  let group = body.querySelector('.decision-trace-group');
  if (!group) {
    group = document.createElement('details');
    group.className = 'decision-trace-group';
    group.open = !collapsed;
    const summary = document.createElement('summary');
    const chevron = document.createElement('span');
    chevron.className = 'trace-chevron';
    chevron.textContent = '⌄';
    const title = document.createElement('span');
    title.textContent = 'Decision Trace · 决策轨迹';
    const count = document.createElement('span');
    count.className = 'decision-trace-count';
    summary.append(chevron, title, count);
    const list = document.createElement('div');
    list.className = 'decision-trace-list';
    group.append(summary, list);
    body.appendChild(group);
  }
  const entry = document.createElement('div');
  entry.className = 'decision-trace-entry';
  entry.textContent = formatDecisionTrace(trace);
  const list = group.querySelector('.decision-trace-list');
  list.appendChild(entry);
  group.querySelector('.decision-trace-count').textContent = `${list.children.length} 条`;
  return true;
}

function outcomeOf(task) {
  if (task.outcome) return task.outcome;
  if (task.status === 'running') return 'run';
  if (task.status === 'completed') return task.is_pass ? 'success' : 'failure';
  if (task.status === 'failed' || task.status === 'terminated') return 'failure';
  return 'pending';
}

function setSelectedUrl(threadId) {
  const url = new URL(window.location.href);
  if (threadId) url.searchParams.set('task', threadId);
  else url.searchParams.delete('task');
  window.history.replaceState({}, '', url);
}

function setHeader(task) {
  const outcome = outcomeOf(task);
  const title = task.conversation_title || task.task || '未命名任务';
  document.getElementById('mainTitle').textContent = title;
  document.getElementById('mainTitle').title = title;
  const details = [`ID ${task.thread_id || currentThreadId || '—'}`];
  if (task.turn_index) details.push(`第 ${task.turn_index} 轮`);
  if (task.attempts) details.push(`审查 ${task.attempts} 轮`);
  if (task.workspace_path) details.push(`工作目录 ${task.workspace_path}`);
  if (task.updated_at || task.created_at) details.push(new Date((task.updated_at || task.created_at) * 1000).toLocaleString('zh-CN'));
  document.getElementById('taskMeta').textContent = details.join(' · ');
  document.getElementById('headerStatus').innerHTML = `<span class="status-badge ${outcome}">${statusLabels[outcome]}</span>`;
}

function isTerminalTask(task) {
  return !!task && ['completed','terminated','failed'].includes(task.status);
}

function updateComposerMode(task=null) {
  const input = document.getElementById('taskInput');
  const workspace = document.getElementById('workspaceInput');
  const hint = document.getElementById('composerHint');
  const continuing = isTerminalTask(task);
  input.placeholder = continuing ? '继续此会话…' : '描述一个任务，例如：随机选择三个城市并查询当前天气…';
  if (task) workspace.value = task.workspace_path || '';
  workspace.disabled = !!(task && task.workspace_path);
  const hotkeyLabel = submitHotkeys[submitHotkey].label;
  hint.textContent = continuing
    ? `${hotkeyLabel} 继续第 ${(task.turn_index || 1) + 1} 轮 · 工作目录在会话内保持不变`
    : `${hotkeyLabel} 执行 · 完成后可在同一会话中继续追加任务`;
}

function turnAnchorId(threadId, index=0) {
  return `turn-${String(threadId || index + 1).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
}

function renderTurnNavigation(turns=[]) {
  const list = document.getElementById('turnNavList');
  const rail = document.getElementById('turnNavRail');
  if (!turns.length) {
    list.innerHTML = '<div class="turn-nav-empty">选择会话后可按轮次快速定位任务。</div>';
    rail.innerHTML = '';
    return;
  }
  const navigationItems = turns.map((turn, index) => {
    const outcome = outcomeOf(turn);
    const title = escapeHtml(turn.task || `第 ${index + 1} 轮任务`);
    const anchor = turnAnchorId(turn.thread_id, index);
    const label = `第 ${turn.turn_index || index + 1} 轮：${title}，${statusLabels[outcome] || outcome}`;
    return {anchor, title, label};
  });
  list.innerHTML = navigationItems.map(item =>
    `<button class="turn-nav-item" type="button" data-turn-anchor="${item.anchor}" title="${item.label}" aria-label="${item.label}"><span class="turn-nav-name">${item.title}</span><span class="turn-nav-marker"></span></button>`
  ).join('');
  rail.innerHTML = navigationItems.map(item =>
    `<button class="turn-nav-rail-item" type="button" data-turn-anchor="${item.anchor}" title="${item.label}" aria-label="${item.label}"><span class="turn-nav-rail-marker"></span></button>`
  ).join('');
  document.querySelectorAll('#turnNav [data-turn-anchor]').forEach(button => button.addEventListener('click', () => {
    const target = document.getElementById(button.dataset.turnAnchor);
    if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
  }));
  requestAnimationFrame(updateActiveTurnNavigation);
}

function updateActiveTurnNavigation() {
  const output = document.getElementById('outputArea');
  const sections = [...document.querySelectorAll('.turn-section')];
  const buttons = [...document.querySelectorAll('#turnNav [data-turn-anchor]')];
  if (!sections.length || !buttons.length) return;
  const outputTop = output.getBoundingClientRect().top;
  let active = sections[0];
  if (output.scrollTop + output.clientHeight >= output.scrollHeight - 4) {
    active = sections[sections.length - 1];
  } else {
    for (const section of sections) {
      if (section.getBoundingClientRect().top - outputTop <= 42) active = section;
      else break;
    }
  }
  buttons.forEach(button => button.classList.toggle('active', button.dataset.turnAnchor === active.id));
}

function showEmpty() {
  document.getElementById('outputInner').innerHTML = '<div class="empty-state"><div class="empty-content"><div class="empty-icon" role="img" aria-label="AgentG Researcher Core Logo"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#researcher-core-mark"></use></svg></div><h2>让专业 Agent 组队完成任务</h2><p>任务会显示在左侧；Router、Orchestrator、Workers 与 Reviewer 的执行过程会在这里持续更新。</p></div></div>';
  document.getElementById('agentStatusBar').classList.remove('visible');
  document.getElementById('summaryBar').classList.remove('visible');
  document.getElementById('jumpBottomBtn').classList.remove('visible');
  renderTurnNavigation([]);
  updateComposerMode(null);
}

function beginTimeline(clear=true) {
  const inner = document.getElementById('outputInner');
  if (clear || !inner.querySelector('.timeline')) {
    inner.innerHTML = '<div class="timeline" id="timeline"></div>';
    liveAgentCards = new Map();
  }
  return document.getElementById('timeline');
}

function setCardCollapsed(card, collapsed) {
  card.classList.toggle('collapsed', collapsed);
  const toggle = card.querySelector('.card-toggle');
  if (toggle) {
    toggle.setAttribute('aria-expanded', String(!collapsed));
    toggle.title = collapsed ? '展开步骤' : '收起步骤';
  }
}

function addCard(node, content, scroll=true, options={}) {
  const timeline = beginTimeline(false);
  const safeNode = cardLabels[node] ? node : 'node';
  const activeTurn = currentThreadId ? document.getElementById(turnAnchorId(currentThreadId)) : null;
  const container = options.container || activeTurn || timeline;
  const card = document.createElement('article');
  card.className = `card ${safeNode}`;
  card.dataset.node = safeNode;
  const header = document.createElement('div');
  header.className = 'card-header';
  const label = document.createElement('div');
  label.className = `agent-label ${safeNode}`;
  label.textContent = cardLabels[node] || node || cardLabels.node;
  const step = document.createElement('span');
  step.className = 'card-step';
  step.textContent = `Step ${timeline.querySelectorAll('.card').length + 1}`;
  const controls = document.createElement('div');
  controls.className = 'card-controls';
  controls.appendChild(step);
  const body = document.createElement('div');
  body.className = 'card-body';
  const cardContent = document.createElement('div');
  cardContent.className = 'card-content';
  const markdownNodes = new Set([
    'task_router','orchestrator','research_worker','code_worker','data_worker',
    'synthesis_worker','reviewer','done','user_summary'
  ]);
  const useMarkdown = options.markdown ?? markdownNodes.has(safeNode);
  if (useMarkdown) {
    cardContent.classList.add('markdown-body');
    cardContent.innerHTML = renderMarkdown(content || '(无输出)');
  } else cardContent.textContent = content || '(无输出)';
  body.appendChild(cardContent);
  const collapsible = options.collapsible !== false && !['user','user_summary'].includes(safeNode);
  if (collapsible) {
    const toggle = document.createElement('button');
    toggle.className = 'card-toggle';
    toggle.type = 'button';
    toggle.textContent = '⌄';
    toggle.setAttribute('aria-label', '收起或展开此步骤');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.addEventListener('click', () => setCardCollapsed(card, !card.classList.contains('collapsed')));
    controls.appendChild(toggle);
  }
  header.append(label, controls);
  card.append(header, body);
  container.appendChild(card);
  if (collapsible && options.collapsed) setCardCollapsed(card, true);
  if (scroll) card.scrollIntoView({behavior:'smooth', block:'end'});
  requestAnimationFrame(updateJumpBottomButton);
  return card;
}

function createProcessGroup(section, terminal) {
  const group = document.createElement('details');
  group.className = 'process-group';
  group.open = !terminal;
  const summary = document.createElement('summary');
  const chevron = document.createElement('span');
  chevron.className = 'process-chevron';
  chevron.textContent = '⌄';
  const title = document.createElement('span');
  title.className = 'process-title';
  title.textContent = '思考与执行过程';
  const count = document.createElement('span');
  count.className = 'process-count';
  summary.append(chevron, title, count);
  const body = document.createElement('div');
  body.className = 'process-body';
  group.append(summary, body);
  section.appendChild(group);
  return {group, body, count};
}

function updateJumpBottomButton() {
  const output = document.getElementById('outputArea');
  const button = document.getElementById('jumpBottomBtn');
  const remaining = output.scrollHeight - output.clientHeight - output.scrollTop;
  button.classList.toggle('visible', output.scrollHeight > output.clientHeight + 24 && remaining > 96);
}

function jumpToConversationBottom() {
  const output = document.getElementById('outputArea');
  output.scrollTo({top:output.scrollHeight, behavior:'smooth'});
}

function focusLatestResult() {
  const summaries = document.querySelectorAll('.turn-section .card.user_summary');
  const target = summaries[summaries.length - 1];
  if (target) target.scrollIntoView({behavior:'smooth', block:'end'});
  else jumpToConversationBottom();
}

function setWorkflowStatus(agent, state, data={}) {
  const suffix = data.batch && data.batch.length ? ` · ${data.batch.join(', ')}` :
    data.targets && data.targets.length ? ` · ${data.targets.join(', ')}` : '';
  const bar = document.getElementById('agentStatusBar');
  bar.classList.add('visible');
  const running = ['thinking','retrying','resuming'].includes(state) || outcomeOf(currentTask || {}) === 'run';
  bar.classList.toggle('running', running && agent !== 'done');
  document.getElementById('workflowStatus').textContent = (workflowLabels[agent] || agent || '工作流执行中') + suffix;
  document.getElementById('workflowDot').className = `workflow-dot ${state || 'thinking'}`;
  updateRuntimeClock();
}

function renderTask(task, scroll=false) {
  currentTask = task;
  setHeader(task);
  const timeline = beginTimeline(true);
  const turns = Array.isArray(task.conversation_turns) && task.conversation_turns.length
    ? task.conversation_turns : [task];
  renderTurnNavigation(turns);
  turns.forEach((turn, index) => {
    const section = document.createElement('section');
    section.className = 'turn-section';
    section.id = turnAnchorId(turn.thread_id, index);
    timeline.appendChild(section);
    const divider = document.createElement('div');
    divider.className = 'turn-divider';
    divider.textContent = `第 ${turn.turn_index || index + 1} 轮 · ${statusLabels[outcomeOf(turn)] || turn.status || ''}`;
    section.appendChild(divider);
    addCard('user', turn.task || '未命名任务', false, {container:section, collapsible:false});

    const messages = Array.isArray(turn.messages) ? turn.messages : [];
    const terminal = isTerminalTask(turn);
    const traces = Array.isArray(turn.decision_traces) ? turn.decision_traces : [];
    const hasTechnicalProcess = messages.length || traces.length || turn.status === 'failed' ||
      turn.status === 'terminated' || (!messages.length && turn.execution_result);
    const process = hasTechnicalProcess ? createProcessGroup(section, terminal) : null;
    const processContainer = process ? process.body : section;
    messages.forEach(message => {
      const card = addCard(
        message.source || 'node', message.content, false,
        {container:processContainer, collapsed:outcomeOf(turn) === 'run'}
      );
      registerAgentCard(card, parseWorkerMessageIdentity(message.content));
    });
    traces.forEach(trace => {
      let card = findAgentCardForTrace(trace);
      if (!card) {
        const node = cardLabels[`${trace.agent_type}_worker`] ? `${trace.agent_type}_worker` : 'node';
        card = addCard(node, `子任务 ${trace.task_id || 'unknown'} · attempt=${trace.attempt || 1}`, false, {container:processContainer});
        registerAgentCard(card, {
          agentType:String(trace.agent_type || ''), taskId:String(trace.task_id || ''), attempt:Number(trace.attempt || 1)
        });
      }
      attachDecisionTraceToCard(card, trace, terminal);
    });
    if (turn.status === 'failed') addCard(
      'error', `执行失败: ${turn.error || '未知错误'}`, false,
      {container:processContainer}
    );
    if (turn.status === 'terminated') {
      const reason = (turn.termination || {}).reason || 'resource_limit';
      addCard('resource_terminated', `资源限制终止: ${reason}`, false, {container:processContainer});
    }
    if (!messages.length && turn.execution_result) addCard(
      'synthesis_worker', turn.execution_result, false,
      {container:processContainer}
    );
    if (outcomeOf(turn) === 'run') {
      const placeholder = document.createElement('div');
      placeholder.className = 'progress-placeholder running';
      const agent = workflowLabels[turn.current_agent] || '等待第一个节点结果';
      placeholder.innerHTML = `<strong>任务正在执行</strong><span>${escapeHtml(agent)} · 运行时间会在顶部实时更新</span>`;
      section.appendChild(placeholder);
    } else if (!messages.length && !turn.execution_result && !turn.error && turn.status !== 'terminated') {
      const placeholder = document.createElement('div');
      placeholder.className = 'progress-placeholder';
      placeholder.innerHTML = '<strong>任务已创建</strong><span>等待开始执行</span>';
      section.appendChild(placeholder);
    }
    if (process) {
      const count = process.body.querySelectorAll(':scope > .card').length;
      process.count.textContent = `${count} 个步骤`;
      if (!count) process.group.remove();
    }
    const userSummary = turn.user_summary || {};
    if (userSummary.title || userSummary.content) {
      const summaryContent = [userSummary.overview, userSummary.content].filter(Boolean).join('\n\n');
      addCard('user_summary', summaryContent, false, {container:section, collapsible:false});
    }
  });

  if (outcomeOf(task) === 'run') setWorkflowStatus(task.current_agent || 'workflow', 'thinking');
  else {
    document.getElementById('agentStatusBar').classList.toggle('visible', !!task.current_agent);
    if (task.current_agent) setWorkflowStatus(task.current_agent, outcomeOf(task) === 'success' ? 'complete' : '');
  }
  updateRuntimeClock();

  const summary = document.getElementById('summaryBar');
  if (task.saved_files && task.saved_files.length) {
    summary.classList.add('visible');
    summary.textContent = `代码产物 · ${task.saved_files.map(path => path.replaceAll('\\','/').split('/').pop()).join(', ')}`;
  } else summary.classList.remove('visible');
  updateComposerMode(task);
  requestAnimationFrame(() => {
    updateActiveTurnNavigation();
    updateJumpBottomButton();
  });
  if (scroll) document.getElementById('outputArea').scrollTop = document.getElementById('outputArea').scrollHeight;
}

function stopDetailPoll() {
  if (detailPoll) clearInterval(detailPoll);
  detailPoll = null;
}

async function fetchTask(threadId) {
  const response = await fetch(`/api/tasks/${threadId}`);
  if (!response.ok) throw new Error(response.status === 404 ? '任务不存在' : '任务详情加载失败');
  return response.json();
}

function fingerprint(task) {
  return [task.status, task.outcome, task.updated_at, (task.messages || []).length,
    (task.decision_traces || []).length, task.current_agent].join('|');
}

function followActiveTask(threadId) {
  stopDetailPoll();
  detailPoll = setInterval(async () => {
    if (currentThreadId !== threadId) return stopDetailPoll();
    try {
      const task = await fetchTask(threadId);
      const nextFingerprint = fingerprint(task);
      if (nextFingerprint !== lastFingerprint) {
        lastFingerprint = nextFingerprint;
        renderTask(task);
        if (isTerminalTask(task)) requestAnimationFrame(focusLatestResult);
        await refreshHistory();
      }
      if (task.status !== 'running') stopDetailPoll();
    } catch (_) { stopDetailPoll(); }
  }, 1800);
}

async function viewTask(threadId, options={}) {
  if (!threadId) return;
  if (eventSource) { eventSource.close(); eventSource = null; }
  stopDetailPoll();
  currentThreadId = threadId;
  setSelectedUrl(threadId);
  try {
    const task = await fetchTask(threadId);
    lastFingerprint = fingerprint(task);
    renderTask(task);
    if (options.focusResult && isTerminalTask(task)) requestAnimationFrame(focusLatestResult);
    else document.getElementById('outputArea').scrollTop = 0;
    await refreshHistory();
    if (task.status === 'running' && task.is_active) followActiveTask(threadId);
    else if ((task.status === 'running' && !task.is_active) || task.status === 'pending') startSSE(threadId);
  } catch (error) {
    addCard('error', error.message);
  }
}

function resetWorkspace(task, threadId) {
  currentTask = {task, thread_id:threadId, status:'running', outcome:'run', run_started_at:Date.now()/1000, created_at:Date.now()/1000};
  setHeader(currentTask);
  const timeline = beginTimeline(true);
  const section = document.createElement('section');
  section.className = 'turn-section';
  section.id = turnAnchorId(threadId);
  timeline.appendChild(section);
  renderTurnNavigation([{task, thread_id:threadId, status:'running', outcome:'run', turn_index:1}]);
  setWorkflowStatus('task_router', 'thinking');
  document.getElementById('summaryBar').classList.remove('visible');
  document.getElementById('jumpBottomBtn').classList.remove('visible');
}

function collapseCompletedAgentCard(node) {
  const cards = [...document.querySelectorAll('.card[data-node]')]
    .filter(card => card.dataset.node === node);
  const card = cards.at(-1);
  if (card && card.querySelector('.card-toggle')) setCardCollapsed(card, true);
}

function startSSE(threadId) {
  stopDetailPoll();
  if (eventSource) eventSource.close();
  eventSource = new EventSource(`/api/tasks/${threadId}/stream`);

  eventSource.addEventListener('status', event => {
    const data = JSON.parse(event.data);
    if (currentTask) {
      currentTask.status = data.agent === 'done' ? currentTask.status : 'running';
      currentTask.outcome = data.agent === 'done' ? currentTask.outcome : 'run';
      currentTask.current_agent = data.agent;
      currentTask.run_started_at ||= Date.now() / 1000;
    }
    if (data.state === 'complete') collapseCompletedAgentCard(data.agent);
    setWorkflowStatus(data.agent, data.state, data);
  });
  eventSource.addEventListener('node', event => {
    const data = JSON.parse(event.data);
    const card = addCard(data.node, data.content);
    registerAgentCard(card, parseWorkerMessageIdentity(data.content));
  });
  eventSource.addEventListener('trace', event => {
    const data = JSON.parse(event.data);
    let card = findAgentCardForTrace(data.trace);
    if (!card) {
      const node = cardLabels[`${data.trace.agent_type}_worker`] ? `${data.trace.agent_type}_worker` : 'node';
      card = addCard(node, `子任务 ${data.trace.task_id || 'unknown'} · attempt=${data.trace.attempt || 1}`);
      registerAgentCard(card, {
        agentType:String(data.trace.agent_type || ''), taskId:String(data.trace.task_id || ''), attempt:Number(data.trace.attempt || 1)
      });
    }
    attachDecisionTraceToCard(card, data.trace, false);
  });
  eventSource.addEventListener('done', async () => {
    eventSource.close(); eventSource = null;
    await viewTask(threadId, {focusResult:true});
  });
  eventSource.addEventListener('error', async event => {
    if (!event.data) return;
    let message = '未知错误';
    try { message = JSON.parse(event.data).error || message; } catch (_) {}
    addCard('error', `执行失败: ${message}`);
    if (eventSource) { eventSource.close(); eventSource = null; }
    try {
      const task = await fetchTask(threadId);
      renderTask(task);
      if (isTerminalTask(task)) requestAnimationFrame(focusLatestResult);
    } catch (_) {}
    await refreshHistory();
  });
  eventSource.addEventListener('heartbeat', updateRuntimeClock);
  eventSource.onerror = () => {
    if (eventSource && eventSource.readyState === EventSource.CLOSED) eventSource = null;
  };
}

async function submitTask() {
  const input = document.getElementById('taskInput');
  const button = document.getElementById('submitBtn');
  const task = input.value.trim();
  if (!task) return input.focus();
  if (currentTask && !isTerminalTask(currentTask)) {
    return window.alert('当前会话仍在执行，请等待结束后继续，或先点击“新建任务”。');
  }
  button.disabled = true;
  button.textContent = '…';
  try {
    const payload = {
      task,
      workspace_path:document.getElementById('workspaceInput').value.trim()
    };
    if (isTerminalTask(currentTask)) payload.parent_thread_id = currentThreadId;
    const response = await fetch('/api/tasks', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    if (!response.ok) {
      const detail = await response.json();
      throw new Error(detail.detail || '任务创建失败');
    }
    const result = await response.json();
    currentThreadId = result.thread_id;
    setSelectedUrl(currentThreadId);
    input.value = '';
    input.style.height = 'auto';
    await refreshHistory();
    await viewTask(currentThreadId);
  } catch (error) {
    window.alert(error.message);
  } finally {
    button.disabled = false;
    button.textContent = '↑';
  }
}

function newTask() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  stopDetailPoll();
  currentThreadId = null;
  currentTask = null;
  lastFingerprint = '';
  setSelectedUrl(null);
  document.getElementById('workspaceInput').disabled = false;
  document.getElementById('workspaceInput').value = '';
  document.getElementById('mainTitle').textContent = '新任务';
  document.getElementById('taskMeta').textContent = '选择左侧任务查看执行过程';
  document.getElementById('headerStatus').innerHTML = '<span class="status-badge pending">Ready</span>';
  showEmpty();
  refreshHistory();
  document.getElementById('taskInput').focus();
}

function closeConversationMenu() {
  document.getElementById('conversationMenu').classList.remove('visible');
}

function openConversationMenu(event, conversation) {
  if (!conversation) return;
  closeThemeMenu();
  conversationMenuTarget = conversation;
  document.getElementById('pinActionLabel').textContent = conversation.is_pinned ? '取消置顶' : '置顶会话';
  const menu = document.getElementById('conversationMenu');
  menu.classList.add('visible');
  const rect = menu.getBoundingClientRect();
  menu.style.left = `${Math.max(8, Math.min(event.clientX, window.innerWidth - rect.width - 8))}px`;
  menu.style.top = `${Math.max(8, Math.min(event.clientY, window.innerHeight - rect.height - 8))}px`;
}

async function requestConversationUpdate(conversationId, payload) {
  const response = await fetch(`/api/conversations/${encodeURIComponent(conversationId)}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.detail || '会话更新失败');
  return result;
}

function closeConversationModal() {
  document.getElementById('conversationModal').classList.remove('visible');
  document.getElementById('modalConfirm').disabled = false;
  modalMode = null;
}

let memoryConversationId = null;
let memoryOffset = 0;
let memoryHistoryOffset = 0;
let memoryRecord = null;
let memoryRequest = 0;
const memoryLabels = {user:'用户',project:'项目',conversation:'会话',artifact:'产物',
  preference:'偏好',fact:'事实',experience:'经验',rule:'规则',active:'生效',candidate:'待确认',
  disabled:'停用',deleted:'已删除',superseded:'已替代'};

function memoryQuery() {
  const query = new URLSearchParams({scope:document.getElementById('memoryScope').value});
  if (memoryConversationId) query.set('conversation_id', memoryConversationId);
  return query;
}

async function memoryFetch(url, options) {
  const response = await fetch(url, options);
  const result = await response.json();
  if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : '记忆请求格式无效');
  return result;
}

function closeMemoryManager() {
  memoryRequest++;
  document.getElementById('memoryModal').classList.remove('visible');
  document.querySelector('.app').inert = false;
  document.getElementById('memoryHeaderToggle').focus();
}

async function openMemoryManager() {
  closeConversationMenu(); closeThemeMenu(); closeHotkeyMenu();
  memoryConversationId = currentTask ? (currentTask.conversation_id || currentTask.thread_id) : null;
  memoryOffset = 0; memoryRecord = null;
  document.getElementById('memoryModal').classList.add('visible');
  document.querySelector('.app').inert = true;
  document.getElementById('memoryDetail').hidden = true;
  document.getElementById('memoryList').textContent = '';
  document.getElementById('memoryError').textContent = '';
  document.getElementById('memoryClose').focus();
  try {
    const settings = await memoryFetch('/api/memories/settings');
    document.getElementById('memorySettings').textContent = `长期记忆：${settings.enabled ? '已启用' : '未启用'} · 用户 ${settings.user_id} · 项目 ${settings.project_id || '未绑定'} · 自动候选提取：${settings.auto_extract ? '开' : '关'}（由用户配置 MEMORY_AUTO_EXTRACT；普通聊天不默认保存）`;
    document.getElementById('memoryRetention').textContent = settings.retention_notice;
    document.querySelector('#memoryScope option[value=project]').disabled = !settings.project_id;
    ['conversation','artifact'].forEach(scope => document.querySelector(`#memoryScope option[value=${scope}]`).disabled = !memoryConversationId);
    document.getElementById('memoryScope').value = 'user';
    if (settings.enabled) await loadMemories();
    else document.getElementById('memoryList').textContent = '请由用户启用 LONG_TERM_MEMORY_ENABLED 后重启服务。此页面不会创建数据库。';
  } catch (error) { document.getElementById('memoryError').textContent = error.message; }
}

async function loadMemories() {
  const ticket = ++memoryRequest;
  memoryRecord = null;
  document.getElementById('memoryDetail').hidden = true;
  document.getElementById('memoryError').textContent = '';
  const query = memoryQuery();
  query.set('limit','50'); query.set('offset',String(memoryOffset));
  if (document.getElementById('memoryStatus').value) query.set('status', document.getElementById('memoryStatus').value);
  try {
    const result = await memoryFetch(`/api/memories?${query}`);
    if (ticket !== memoryRequest) return;
    const list = document.getElementById('memoryList');
    list.replaceChildren();
    result.items.forEach(record => {
      const button = document.createElement('button');
      button.type = 'button'; button.dataset.memoryId = record.memory_id;
      button.textContent = `${memoryLabels[record.kind]} · ${memoryLabels[record.status]} · v${record.version}${record.usable ? '' : ' · 不参与检索'}\n${record.content.slice(0,90)}`;
      button.addEventListener('click', () => { memoryHistoryOffset = 0; loadMemoryDetail(record.memory_id); });
      list.append(button);
    });
    if (!result.items.length) list.textContent = '此范围暂无条目。候选不会自动进入模型上下文。';
    document.getElementById('memoryPrev').disabled = memoryOffset === 0;
    document.getElementById('memoryNext').disabled = !result.has_more;
  } catch (error) { if (ticket === memoryRequest) document.getElementById('memoryError').textContent = error.message; }
}

async function loadMemoryDetail(id) {
  const ticket = ++memoryRequest;
  document.getElementById('memoryDetail').hidden = true;
  try {
    const query = memoryQuery(); query.set('offset',String(memoryHistoryOffset));
    const result = await memoryFetch(`/api/memories/${encodeURIComponent(id)}?${query}`);
    if (ticket !== memoryRequest) return;
    memoryRecord = result.record;
    document.getElementById('memoryDetail').hidden = false;
    document.getElementById('memoryError').textContent = '';
    document.getElementById('memoryMetadata').textContent = `${id}\n${memoryLabels[memoryRecord.scope]} / ${memoryLabels[memoryRecord.kind]} / ${memoryLabels[memoryRecord.status]} · v${memoryRecord.version}\nSHA-256 ${memoryRecord.content_hash}\n观测：${memoryRecord.observed_at || '无'}\n到期：${memoryRecord.expires_at || '未设置'}\n当前修改原因：${memoryRecord.revision_note || '无'}`;
    document.getElementById('memoryBody').value = memoryRecord.content;
    document.getElementById('memoryReason').value = '';
    document.getElementById('memoryConsent').checked = false;
    document.getElementById('memoryHistory').textContent = result.history.map(item => `v${item.version} · ${memoryLabels[item.status]} · ${item.updated_at}\n原因：${item.revision_note || '无'}\n正文：${item.content}\n来源：${JSON.stringify(item.source_refs,null,2)}`).join('\n\n');
    document.getElementById('memoryHistoryPrev').disabled = memoryHistoryOffset === 0;
    document.getElementById('memoryHistoryNext').disabled = !result.has_more;
    document.getElementById('memoryApply').disabled = ['deleted','superseded'].includes(memoryRecord.status);
    document.getElementById('memoryAction').value = memoryRecord.status === 'candidate' ? 'confirm' : memoryRecord.status === 'disabled' ? 'enable' : 'correct';
    document.getElementById('memoryBody').readOnly = document.getElementById('memoryAction').value !== 'correct';
    document.querySelectorAll('[data-memory-id]').forEach(button => button.setAttribute('aria-current',String(button.dataset.memoryId === id)));
  } catch (error) { if (ticket === memoryRequest) document.getElementById('memoryError').textContent = error.message; }
}

async function applyMemoryAction() {
  if (!memoryRecord) return;
  const button = document.getElementById('memoryApply');
  const record = memoryRecord;
  const action = document.getElementById('memoryAction').value;
  const reason = document.getElementById('memoryReason').value.trim();
  if (!document.getElementById('memoryConsent').checked || !reason) {
    document.getElementById('memoryError').textContent = '请填写操作原因，并确认当前条目和作用域。'; return;
  }
  const payload = {action,reason,confirmed_content:record.content,
    expected:{memory_id:record.memory_id,version:record.version,content_hash:record.content_hash}};
  if (action === 'correct') payload.content = document.getElementById('memoryBody').value;
  button.disabled = true;
  try {
    const result = await memoryFetch(`/api/memories/${encodeURIComponent(record.memory_id)}/actions?${memoryQuery()}`, {
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    showToast(`记忆已更新：v${result.record.version} · ${memoryLabels[result.record.status]}`);
    await loadMemories(); memoryHistoryOffset = 0; await loadMemoryDetail(record.memory_id);
  } catch (error) { document.getElementById('memoryError').textContent = error.message; }
  finally { button.disabled = memoryRecord ? ['deleted','superseded'].includes(memoryRecord.status) : true; }
}

function openConversationModal(mode) {
  if (!conversationMenuTarget) return;
  modalMode = mode;
  closeConversationMenu();
  const title = conversationMenuTarget.conversation_title || conversationMenuTarget.task || '未命名会话';
  const modal = document.getElementById('conversationModal');
  const input = document.getElementById('modalInput');
  const confirm = document.getElementById('modalConfirm');
  document.getElementById('modalMemoryCleanup').hidden = mode !== 'delete';
  if (mode === 'rename') {
    document.getElementById('modalTitle').textContent = '重命名会话';
    document.getElementById('modalDescription').textContent = '新名称会同步到该会话的全部轮次。';
    input.style.display = 'block';
    input.value = title;
    confirm.textContent = '保存';
    confirm.className = 'primary';
    modal.classList.add('visible');
    requestAnimationFrame(() => { input.focus(); input.select(); });
  } else {
    document.getElementById('modalTitle').textContent = '删除会话';
    document.getElementById('modalDescription').textContent = `将永久删除“${title}”的所有轮次和检查点。此操作不可撤销。`;
    input.style.display = 'none';
    confirm.textContent = '删除';
    confirm.className = 'danger';
    modal.classList.add('visible');
    requestAnimationFrame(() => confirm.focus());
    document.getElementById('memoryCleanupSelect').value = 'conversation';
    document.getElementById('memoryImpact').textContent = '正在核查关联记忆…';
    const id = conversationMenuTarget.conversation_id;
    memoryFetch(`/api/conversations/${encodeURIComponent(id)}/memory-impact`).then(result => {
      if (modalMode === 'delete' && conversationMenuTarget?.conversation_id === id)
        document.getElementById('memoryImpact').textContent = result.enabled
          ? `会话私有/产物 ${result.private} 条，关联用户/项目 ${result.promoted} 条。逻辑删除仍保留旧版本和备份原文；旧备份不得直接作为清理后的库启用。`
          : '长期记忆关闭：本次不访问 SQLite，仅删除会话历史。若需要清理已保存记忆，请先启用长期记忆再删除会话。';
    }).catch(error => { document.getElementById('memoryImpact').textContent = error.message; });
  }
}

async function confirmConversationModal() {
  if (!conversationMenuTarget || !modalMode) return;
  const confirm = document.getElementById('modalConfirm');
  confirm.disabled = true;
  const conversationId = conversationMenuTarget.conversation_id;
  try {
    if (modalMode === 'rename') {
      const title = document.getElementById('modalInput').value.trim();
      if (!title) throw new Error('会话名称不能为空');
      const result = await requestConversationUpdate(conversationId, {title});
      conversationMenuTarget.conversation_title = result.conversation_title;
      if (currentTask && (currentTask.conversation_id || currentTask.thread_id) === conversationId) {
        currentTask.conversation_title = result.conversation_title;
        setHeader(currentTask);
      }
      await refreshHistory();
      showToast('会话已重命名');
    } else {
      const cleanup = document.getElementById('memoryCleanupSelect').value;
      const response = await fetch(`/api/conversations/${encodeURIComponent(conversationId)}?memory_cleanup=${encodeURIComponent(cleanup)}`, {method:'DELETE'});
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || '会话删除失败');
      if (currentTask && (currentTask.conversation_id || currentTask.thread_id) === conversationId) newTask();
      else await refreshHistory();
      showToast(`已删除 ${result.deleted_runs} 轮会话，逻辑删除 ${result.deleted_memories || 0} 条关联记忆`);
    }
    closeConversationModal();
  } catch (error) {
    confirm.disabled = false;
    showToast(error.message, true);
  }
}

async function togglePinnedConversation() {
  if (!conversationMenuTarget) return;
  const nextPinned = !conversationMenuTarget.is_pinned;
  closeConversationMenu();
  try {
    await requestConversationUpdate(conversationMenuTarget.conversation_id, {is_pinned:nextPinned});
    conversationMenuTarget.is_pinned = nextPinned;
    await refreshHistory();
    showToast(nextPinned ? '会话已置顶' : '已取消置顶');
  } catch (error) {
    showToast(error.message, true);
  }
}

function renderHistory(tasks) {
  const list = document.getElementById('historyList');
  const conversations = new Map();
  tasks.forEach(task => {
    const id = task.conversation_id || task.thread_id;
    if (!conversations.has(id)) conversations.set(id, {...task, conversation_id:id, turn_count:0});
    const conversation = conversations.get(id);
    conversation.turn_count += 1;
    conversation.turn_index = Math.max(conversation.turn_index || 1, task.turn_index || 1);
    conversation.is_pinned = conversation.is_pinned || task.is_pinned;
  });
  historyConversations = conversations;
  const items = [...conversations.values()].sort((left, right) =>
    Number(Boolean(right.is_pinned)) - Number(Boolean(left.is_pinned)) ||
    (right.created_at || 0) - (left.created_at || 0)
  );
  document.getElementById('taskCount').textContent = items.length;
  if (!items.length) {
    list.innerHTML = '<div class="history-empty">暂无任务。请在下方输入任务描述。</div>';
    return;
  }
  list.innerHTML = items.map(task => {
    const outcome = outcomeOf(task);
    const selectedConversation = currentTask ? (currentTask.conversation_id || currentTask.thread_id) : currentThreadId;
    const active = selectedConversation === task.conversation_id ? ' active' : '';
    const title = escapeHtml(task.conversation_title || task.task || '未命名任务');
    const time = task.created_at ? new Date(task.created_at * 1000).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const turns = task.turn_count > 1 ? `· ${task.turn_count} 轮` : '';
    const pin = task.is_pinned ? '<span class="history-pin" title="已置顶">◆</span>' : '';
    return `<button type="button" class="history-item${active}" data-thread-id="${escapeHtml(task.thread_id)}" data-conversation-id="${escapeHtml(task.conversation_id)}"><div class="history-title" title="${title}">${pin}<span class="history-title-text">${title}</span></div><div class="history-meta"><span class="status-badge ${outcome}">${statusLabels[outcome]}</span><span class="history-time">${time} ${turns}</span></div></button>`;
  }).join('');
  list.querySelectorAll('[data-thread-id]').forEach(item => {
    item.addEventListener('click', () => viewTask(item.dataset.threadId));
    item.addEventListener('contextmenu', event => {
      event.preventDefault();
      openConversationMenu(event, historyConversations.get(item.dataset.conversationId));
    });
  });
}

async function refreshHistory() {
  try {
    const response = await fetch('/api/tasks');
    if (!response.ok) throw new Error('任务列表加载失败');
    const tasks = await response.json();
    renderHistory(tasks);
    return tasks;
  } catch (_) {
    document.getElementById('historyList').innerHTML = '<div class="history-empty">任务列表暂时不可用。</div>';
    return [];
  }
}

async function refreshHealth() {
  try {
    const response = await fetch('/api/health');
    const health = await response.json();
    const ok = health.status === 'ok';
    document.getElementById('connectionDot').className = `connection-dot ${ok ? 'ok' : 'error'}`;
    document.getElementById('connectionText').textContent = ok ? `${health.persistence === 'redis' ? 'Redis' : 'Memory'} 已连接` : '持久化服务异常';
  } catch (_) {
    document.getElementById('connectionDot').className = 'connection-dot error';
    document.getElementById('connectionText').textContent = '服务不可用';
  }
}

async function bootstrap() {
  initialiseTheme();
  initialiseSubmitHotkey();
  await refreshHealth();
  const tasks = await refreshHistory();
  const queryTask = new URL(window.location.href).searchParams.get('task');
  const initialTask = queryTask || (tasks.find(task => outcomeOf(task) === 'run') || {}).thread_id;
  if (initialTask) await viewTask(initialTask);
}

document.getElementById('taskForm').addEventListener('submit', event => { event.preventDefault(); submitTask(); });
document.getElementById('newTaskBtn').addEventListener('click', newTask);
document.getElementById('themeToggle').addEventListener('click', event => {
  event.stopPropagation();
  closeConversationMenu();
  closeHotkeyMenu();
  const menu = document.getElementById('themeMenu');
  const visible = menu.classList.toggle('visible');
  document.getElementById('themeToggle').setAttribute('aria-expanded', String(visible));
});
document.querySelectorAll('.theme-option').forEach(option => option.addEventListener('click', () => {
  applyTheme(option.dataset.theme);
  closeThemeMenu();
}));
document.getElementById('hotkeyToggle').addEventListener('click', event => {
  event.stopPropagation();
  closeConversationMenu();
  closeThemeMenu();
  const menu = document.getElementById('hotkeyMenu');
  const visible = menu.classList.toggle('visible');
  document.getElementById('hotkeyToggle').setAttribute('aria-expanded', String(visible));
});
document.querySelectorAll('.hotkey-option').forEach(option => option.addEventListener('click', () => {
  applySubmitHotkey(option.dataset.hotkey);
  closeHotkeyMenu();
  showToast(`执行热键已改为 ${submitHotkeys[submitHotkey].label}`);
}));
document.getElementById('conversationMenu').addEventListener('click', event => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'pin') togglePinnedConversation();
  else if (action === 'rename') openConversationModal('rename');
  else if (action === 'delete') openConversationModal('delete');
});
document.getElementById('modalCancel').addEventListener('click', closeConversationModal);
document.getElementById('memoryToggle').addEventListener('click', openMemoryManager);
document.getElementById('memoryHeaderToggle').addEventListener('click', openMemoryManager);
document.getElementById('memoryClose').addEventListener('click', closeMemoryManager);
document.getElementById('memoryRefresh').addEventListener('click', loadMemories);
document.getElementById('memoryApply').addEventListener('click', applyMemoryAction);
document.getElementById('memoryAction').addEventListener('change', () => {
  document.getElementById('memoryBody').readOnly = document.getElementById('memoryAction').value !== 'correct';
  document.getElementById('memoryConsent').checked = false;
});
['memoryScope','memoryStatus'].forEach(id => document.getElementById(id).addEventListener('change', () => { memoryOffset = 0; loadMemories(); }));
document.getElementById('memoryPrev').addEventListener('click', () => { memoryOffset = Math.max(0,memoryOffset-50); loadMemories(); });
document.getElementById('memoryNext').addEventListener('click', () => { memoryOffset += 50; loadMemories(); });
document.getElementById('memoryHistoryPrev').addEventListener('click', () => { if (memoryRecord) { memoryHistoryOffset = Math.max(0,memoryHistoryOffset-25); loadMemoryDetail(memoryRecord.memory_id); } });
document.getElementById('memoryHistoryNext').addEventListener('click', () => { if (memoryRecord) { memoryHistoryOffset += 25; loadMemoryDetail(memoryRecord.memory_id); } });
document.getElementById('memoryModal').addEventListener('click', event => { if (event.target.id === 'memoryModal') closeMemoryManager(); });
document.getElementById('modalConfirm').addEventListener('click', confirmConversationModal);
document.getElementById('conversationModal').addEventListener('click', event => {
  if (event.target.id === 'conversationModal') closeConversationModal();
});
document.addEventListener('pointerdown', event => {
  if (!event.target.closest('#conversationMenu')) closeConversationMenu();
  if (!event.target.closest('#themeMenu') && !event.target.closest('#themeToggle')) closeThemeMenu();
  if (!event.target.closest('#hotkeyMenu') && !event.target.closest('#hotkeyToggle')) closeHotkeyMenu();
});
document.getElementById('taskInput').addEventListener('input', event => {
  event.target.style.height = 'auto';
  event.target.style.height = `${Math.min(event.target.scrollHeight, 140)}px`;
});
document.getElementById('outputArea').addEventListener('scroll', () => {
  updateActiveTurnNavigation();
  updateJumpBottomButton();
}, {passive:true});
document.getElementById('jumpBottomBtn').addEventListener('click', jumpToConversationBottom);
window.addEventListener('resize', updateJumpBottomButton, {passive:true});
document.getElementById('taskInput').addEventListener('keydown', event => {
  if (matchesSubmitHotkey(event)) { event.preventDefault(); submitTask(); }
});
document.addEventListener('keydown', event => {
  if (document.getElementById('memoryModal').classList.contains('visible')) {
    if (event.key === 'Escape') closeMemoryManager();
    if (event.key.toLowerCase() === 'n' && event.ctrlKey) event.preventDefault();
    if (event.key === 'Tab') {
      const focusable = [...document.querySelectorAll('#memoryModal button:not(:disabled),#memoryModal select:not(:disabled),#memoryModal textarea,#memoryModal input')].filter(node => node.getClientRects().length);
      const first = focusable[0], last = focusable[focusable.length-1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
    return;
  }
  if (event.key === 'Escape') { closeConversationMenu(); closeThemeMenu(); closeHotkeyMenu(); closeConversationModal(); }
  if (event.key === 'Enter' && document.getElementById('conversationModal').classList.contains('visible') && modalMode === 'rename') confirmConversationModal();
  if (event.key.toLowerCase() === 'n' && event.ctrlKey) { event.preventDefault(); newTask(); }
});

bootstrap();
setInterval(refreshHistory, 8000);
setInterval(refreshHealth, 30000);
setInterval(updateRuntimeClock, 1000);
</script>
</body>
</html>
