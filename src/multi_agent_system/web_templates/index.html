<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentG — 多智能体协作系统</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --border: #2e3348; --text: #e1e4ed; --text2: #8b90a5;
  --accent: #6c8aff; --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
  --planner: #a78bfa; --executor: #38bdf8; --reviewer: #4ade80;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter','Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; }
.sidebar { width:340px; min-width:340px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.sidebar-header { padding:22px 24px; border-bottom:1px solid var(--border); }
.sidebar-header h1 { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg,var(--accent),#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sidebar-header p { font-size:.75rem; color:var(--text2); margin-top:4px; }
.task-form { padding:16px 24px; border-bottom:1px solid var(--border); }
.task-form label { display:block; font-size:.75rem; font-weight:600; margin-bottom:6px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
.task-form textarea { width:100%; height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:10px 12px; font-size:.85rem; resize:vertical; font-family:inherit; transition:border .2s; }
.task-form textarea:focus { outline:none; border-color:var(--accent); }
.task-form button { width:100%; margin-top:10px; padding:10px 0; background:linear-gradient(135deg,var(--accent),#8b5cf6); border:none; border-radius:var(--radius); color:#fff; font-weight:600; font-size:.9rem; cursor:pointer; }
.task-form button:hover { opacity:.9; }
.task-form button:disabled { opacity:.5; cursor:not-allowed; }
.history { flex:1; overflow-y:auto; }
.history h3 { font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); padding:12px 24px 6px; }
.history-item { padding:10px 24px; cursor:pointer; border-left:3px solid transparent; transition:background .15s; }
.history-item:hover { background:var(--surface2); }
.history-item.active { background:var(--surface2); border-left-color:var(--accent); }
.history-item .t { font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.history-item .m { font-size:.68rem; color:var(--text2); margin-top:3px; display:flex; gap:8px; align-items:center; }
.badge { font-size:.62rem; padding:1px 7px; border-radius:10px; font-weight:600; text-transform:uppercase; }
.badge-pass { background:#14532d; color:var(--green); }
.badge-fail { background:#451a1a; color:var(--red); }
.badge-running { background:#1e3a5f; color:var(--executor); }
.badge-pending { background:#2d2a14; color:var(--yellow); }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.main-header { padding:14px 28px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.main-header h2 { font-size:.9rem; font-weight:600; display:flex; align-items:center; gap:8px; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--text2); }
.dot.running { background:var(--executor); animation:pulse 1.5s infinite; }
.dot.done { background:var(--green); }
.dot.error { background:var(--red); }
.agent-status-bar {
  margin: 0 28px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; gap: 10px; font-size: .82rem;
}
.workflow-dot { width:7px; height:7px; border-radius:50%; background:var(--text2); }
.workflow-dot.thinking,.workflow-dot.retrying { background:var(--executor); animation:pulse 1s infinite; }
.workflow-dot.complete { background:var(--green); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.output { flex:1; overflow-y:auto; padding:20px 28px; }
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); text-align:center; }
.empty .icon { font-size:3rem; margin-bottom:12px; opacity:.4; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.card-header { padding:8px 16px; font-weight:700; font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; }
.card-header.task_router,.card-header.orchestrator { background:rgba(167,139,250,.15); color:var(--planner); }
.card-header.research_worker,.card-header.code_worker,.card-header.data_worker,.card-header.synthesis_worker { background:rgba(56,189,248,.15); color:var(--executor); }
.card-header.reviewer { background:rgba(74,222,128,.15); color:var(--reviewer); }
.card-header.error { background:rgba(248,113,113,.15); color:var(--red); }
.card-header.done { background:rgba(108,138,255,.15); color:var(--accent); }
.card-body { padding:14px 16px; font-size:.84rem; white-space:pre-wrap; word-break:break-word; font-family:'JetBrains Mono','Cascadia Code','Consolas',monospace; line-height:1.55; max-height:400px; overflow-y:auto; }
.summary { padding:12px 28px; border-top:1px solid var(--border); font-size:.78rem; color:var(--text2); display:flex; gap:20px; }
@media (max-width:700px) { body{flex-direction:column} .sidebar{width:100%;min-width:0;max-height:40vh} .main{min-height:0} }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>🤖 AgentG</h1>
    <p>Orchestrator–Worker · 依赖感知并行 · 定向返工</p>
  </div>
  <form class="task-form" onsubmit="event.preventDefault();submitTask()">
    <label for="taskInput">📝 任务描述</label>
    <textarea id="taskInput" placeholder="例如：分析销售数据CSV，计算季度增长率…"></textarea>
    <button type="submit" id="submitBtn">🚀 开始执行</button>
  </form>
  <div class="history">
    <h3>📋 历史任务</h3>
    <div id="historyList" style="font-size:.78rem;color:var(--text2);padding:0 24px;">暂无记录</div>
  </div>
</aside>

<main class="main">
  <div class="main-header">
    <h2><span class="dot" id="statusDot"></span><span id="mainTitle">请创建新任务</span></h2>
    <span style="font-size:.72rem;color:var(--text2)" id="attemptInfo"></span>
  </div>
  <div class="agent-status-bar" id="agentStatusBar" style="display:none">
    <span style="font-weight:600;color:var(--text2);margin-right:4px">流程:</span>
    <span class="workflow-dot" id="workflowDot"></span>
    <span id="workflowStatus">等待任务</span>
  </div>
  <div class="output" id="outputArea">
    <div class="empty"><div class="icon">🚀</div><p>在左侧输入任务描述后点击「开始执行」<br>实时观看 Orchestrator 与专业 Worker 协作</p></div>
  </div>
  <div class="summary" id="summaryBar" style="display:none"></div>
</main>

<script>
let currentThreadId = null;
let es = null;
const workflowLabels = {
  task_router:'任务分流', orchestrator:'Orchestrator 规划', workers:'专业 Worker 执行',
  research_worker:'ResearchAgent', code_worker:'CodeAgent', data_worker:'DataAgent',
  synthesis_worker:'SynthesisAgent', fan_in:'结果汇聚', reviewer:'结构化审查',
  revision:'定向返工', prepare_revision:'准备定向返工',
  resource_terminated:'资源限制终止', done:'完成'
};

async function submitTask() {
  const input = document.getElementById('taskInput');
  const task = input.value.trim();
  if (!task) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '⏳ 提交中...';

  try {
    const r = await fetch('/api/tasks', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task}) });
    if (!r.ok) { const e = await r.json(); alert(e.detail); btn.disabled=false; btn.textContent='🚀 开始执行'; return; }
    const { thread_id } = await r.json();
    currentThreadId = thread_id;
    input.value = '';
    resetUI(task);
    startSSE(thread_id);
    refreshHistory();
  } catch(e) { alert('请求失败: '+e.message); }
  btn.disabled = false; btn.textContent = '🚀 开始执行';
}

function resetUI(task) {
  document.getElementById('outputArea').innerHTML = '';
  document.getElementById('statusDot').className = 'dot running';
  document.getElementById('mainTitle').textContent = '运行中 · ' + task.slice(0,45) + (task.length>45?'…':'');
  document.getElementById('attemptInfo').textContent = '';
  document.getElementById('summaryBar').style.display = 'none';
  document.getElementById('agentStatusBar').style.display = 'flex';
  setWorkflowStatus('task_router', 'thinking');
}

function setWorkflowStatus(agent, state, data={}) {
  const suffix = data.batch && data.batch.length ? ' · '+data.batch.join(', ') :
    data.targets && data.targets.length ? ' · '+data.targets.join(', ') : '';
  document.getElementById('workflowStatus').textContent = (workflowLabels[agent] || agent) + suffix;
  document.getElementById('workflowDot').className = 'workflow-dot ' + state;
}

function startSSE(tid) {
  if (es) es.close();
  es = new EventSource('/api/tasks/'+tid+'/stream');

  es.addEventListener('status', e => {
    const d = JSON.parse(e.data);
    setWorkflowStatus(d.agent, d.state, d);
  });

  es.addEventListener('node', e => {
    const d = JSON.parse(e.data);
    addCard(d.node, d.content);
  });

  es.addEventListener('done', async () => {
    es.close(); es = null;
    document.getElementById('statusDot').className = 'dot done';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '🚀 开始执行';
    setWorkflowStatus('done', 'complete');
    try {
      const r = await fetch('/api/tasks/'+tid); const d = await r.json();
      if (d.status==='terminated') {
        document.getElementById('statusDot').className = 'dot error';
        setWorkflowStatus('resource_terminated', 'complete');
        addCard('resource_terminated', '资源限制终止: '+((d.termination||{}).reason||'resource_limit'));
      }
      document.getElementById('attemptInfo').textContent = '⏱ 审查:'+d.attempts+'轮 | '+(d.is_pass?'✅ 审查通过':'❌ 审查未通过');
      if (d.saved_files && d.saved_files.length) {
        document.getElementById('summaryBar').style.display = 'flex';
        document.getElementById('summaryBar').textContent = '📁 代码保存: '+d.saved_files.map(f=>f.split('/').pop()).join(', ');
      }
    } catch(_) {}
    refreshHistory();
  });

  es.addEventListener('error', e => {
    let msg = '未知错误'; try { msg = JSON.parse(e.data).error || msg; } catch(_) {}
    addCard('error', '执行失败: '+msg);
    document.getElementById('statusDot').className = 'dot error';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '🚀 开始执行';
    if (es) { es.close(); es = null; }
    refreshHistory();
  });

  es.addEventListener('heartbeat', () => {});
  es.onerror = () => { if (es && es.readyState === EventSource.CLOSED) es = null; };
}

function addCard(node, content) {
  const area = document.getElementById('outputArea');
  const empty = area.querySelector('.empty');
  if (empty) empty.remove();

  const labels = {
    task_router:'🚦 Task Router · 任务分流', orchestrator:'🧭 Orchestrator · 任务编排',
    research_worker:'🔎 ResearchAgent · 研究', code_worker:'💻 CodeAgent · 编码',
    data_worker:'📊 DataAgent · 数据', synthesis_worker:'🧩 SynthesisAgent · 综合',
    reviewer:'🔍 Reviewer · 结构化审查', resource_terminated:'⛔ 资源限制终止',
    error:'❌ 错误', done:'✅ 完成'
  };

  const card = document.createElement('div'); card.className = 'card';
  const hdr = document.createElement('div'); hdr.className = 'card-header '+node;
  hdr.textContent = labels[node] || node.toUpperCase();
  const body = document.createElement('div'); body.className = 'card-body';
  body.textContent = content || '(无输出)';
  card.appendChild(hdr); card.appendChild(body);
  area.appendChild(card);
  card.scrollIntoView({ behavior:'smooth', block:'end' });
}

async function refreshHistory() {
  try {
    const r = await fetch('/api/tasks'); const tasks = await r.json();
    if (!tasks.length) { document.getElementById('historyList').innerHTML = '<span style="font-size:.78rem;color:var(--text2);padding:0 24px;">暂无记录</span>'; return; }
    document.getElementById('historyList').innerHTML = tasks.map(t => {
      let b = ''; const s = t.status;
      if (s==='completed') b = t.is_pass ? '<span class="badge badge-pass">PASS</span>' : '<span class="badge badge-fail">FAIL</span>';
      else if (s==='terminated') b = '<span class="badge badge-fail">LIMIT</span>';
      else if (s==='running') b = '<span class="badge badge-running">RUN</span>';
      else b = '<span class="badge badge-pending">PEND</span>';
      const cls = currentThreadId===t.thread_id?' active':'';
      return '<div class="history-item'+cls+'" onclick="viewTask(\''+t.thread_id+'\')"><div class="t">'+esc(t.task.slice(0,45))+(t.task.length>45?'…':'')+'</div><div class="m">'+b+' <span>审查'+t.attempts+'轮</span> <span>'+new Date(t.created_at*1000).toLocaleString('zh-CN')+'</span></div></div>';
    }).join('');
  } catch(_) {}
}

async function viewTask(tid) {
  if (es) { es.close(); es = null; }
  currentThreadId = tid;
  try {
    const r = await fetch('/api/tasks/'+tid);
    if (!r.ok) { alert('任务不存在'); return; }
    const d = await r.json();
    document.getElementById('outputArea').innerHTML = '';
    document.getElementById('summaryBar').style.display = 'none';
    document.getElementById('statusDot').className = 'dot' + (d.status==='completed'?' done':(d.status==='failed'||d.status==='terminated')?' error':'');
    document.getElementById('mainTitle').textContent = '查看 · '+d.task.slice(0,45)+(d.task.length>45?'…':'');
    document.getElementById('attemptInfo').textContent = d.status==='completed' ? ('⏱ 审查:'+d.attempts+'轮 | '+(d.is_pass?'✅ 审查通过':'❌ 审查未通过')) : '';
    if (d.status==='failed') addCard('error', '失败: '+(d.error||'未知错误'));
    if (d.status==='terminated') addCard('resource_terminated', '资源限制终止: '+((d.termination||{}).reason||'resource_limit'));
    if (d.messages) {
      d.messages.forEach((m,i) => addCard(m.source || 'node-'+i, m.content));
    }
    if (d.saved_files && d.saved_files.length) {
      document.getElementById('summaryBar').style.display = 'flex';
      document.getElementById('summaryBar').textContent = '📁 代码: '+d.saved_files.map(f=>f.split('/').pop()).join(', ');
    }
  } catch(e) { alert('加载失败: '+e.message); }
  refreshHistory();
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

refreshHistory();
setInterval(refreshHistory, 10000);
</script>
</body>
</html>
